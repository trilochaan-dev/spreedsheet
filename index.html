<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/spreadsheet.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Firebase CDN (compat) SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>

  <script>
    // Your Firebase configuration - replace with your actual values
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      // add other config fields if needed (like storageBucket etc.)
    };

    // Initialize Firebase App
    firebase.initializeApp(firebaseConfig);

    // Initialize Auth service and Google provider
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // Sign in function, called by button onclick
    function signInWithGoogle() {
      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          alert("Signed in as: " + user.displayName);
          console.log("User info:", user);
          // You can now show/hide UI or save user info locally
        })
        .catch((error) => {
          console.error("Sign-in error:", error);
          alert("Sign-in failed: " + error.message);
        });
    }
  </script>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <button id="toggle-arrow" class="toggle on" onclick="sidebar()">
      <img src="res/arrow.svg" alt="" />
    </button>
    <div>
      <img src="res/house.svg" alt="" />
      <span class="dd-text">home</span>
      <span class="text">Home</span>
    </div>
    <div>
      <img src="res/customers.svg" alt="" />
      <span class="dd-text">customer</span>
      <span class="text">customer</span>
    </div>
    <div> 
      <img src="res/timeline.svg" alt="" />
      <span class="dd-text">timeline</span>
      <span class="text">timeline</span>
    </div>
    <div>
      <button onclick="signInWithGoogle()">Sign in with Google</button>
    </div>
  </div>
  <div id="main">
    <table id="sheet">
      <tr>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td><input type="text" /></td>
        <td><input type="text" /></td>
      </tr>
      <tr>
        <td></td>
        <td><input type="text" /></td>
        <td><input type="text" /></td>
      </tr>
    </table>
  </div>

  <script src="js/script.js"></script>
  <script src="js/table.js"></script>
  <!-- Removed firebase-autho.js because auth code is inline now -->
</body>
</html>
